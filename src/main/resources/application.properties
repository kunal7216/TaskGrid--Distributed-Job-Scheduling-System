spring.application.name=distributed-job-scheduling-system
server.port=8080

spring.datasource.url=jdbc:h2:mem:jobschedulerdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

scheduler.worker.enabled=true
scheduler.worker.poll-interval-ms=3000
scheduler.worker.batch-size=5
scheduler.job.max-retries=3
scheduler.leader.node-id=node-1
scheduler.leader.ttl-seconds=15
